<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Ledger - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; margin:0; padding:20px; }
h1{ text-align:center; margin-bottom:20px; }
.card{ background:#1e293b; padding:15px; border-radius:12px; margin-bottom:15px; transition: all 0.3s ease; }
.card:hover{ transform: translateY(-3px); }
input, select, button{ width:100%; padding:10px; margin-top:8px; border-radius:8px; border:none; font-size:14px; }
button{ background:#22c55e; color:white; font-weight:bold; cursor:pointer; transition: opacity 0.2s; }
button:hover{ opacity:0.9; }
.income{ color:#22c55e; }
.expense{ color:#ef4444; }
.summary{ display:flex; justify-content:space-between; gap:10px; margin-bottom:15px; }
.summary div{ flex:1; text-align:center; background:#334155; padding:10px; border-radius:10px; }
.transaction{ display:flex; justify-content:space-between; background:#1e293b; padding:10px; border-radius:8px; margin-bottom:8px; align-items:center; }
.delete{ background:#ef4444; margin-left:10px; padding:5px 8px; border-radius:5px; cursor:pointer; }
canvas{ margin-top:20px; border-radius:12px; background:#1e293b; padding:10px; }
.nav{ display:flex; justify-content:center; gap:20px; margin-bottom:20px; }
.nav a{ color:#22c55e; text-decoration:none; font-weight:bold; }
.nav a:hover{ text-decoration:underline; }
.progress-container{ background:#334155; border-radius:10px; margin-top:10px; height:20px; width:100%; }
.progress-bar{ height:100%; width:0%; background:#22c55e; border-radius:10px; text-align:center; color:white; font-weight:bold; }
</style>
</head>
<body>
<h1>Alpha Ledger</h1>
<div class="nav">
<a href="index.html">Dashboard</a>
<a href="sobre.html">Sobre</a>
<a href="config.html">Configurações</a>
<a href="backup.html">Backup</a>
</div>

<div class="card">
<input type="text" id="desc" placeholder="Descrição">
<input type="number" id="amount" placeholder="Valor">
<select id="category">
<option value="Alimentação">Alimentação</option>
<option value="Transporte">Transporte</option>
<option value="Lazer">Lazer</option>
<option value="Investimento">Investimento</option>
<option value="Outro">Outro</option>
</select>
<select id="type">
<option value="income">Entrada</option>
<option value="expense">Saída</option>
</select>
<button onclick="addTransaction()">Adicionar</button>
</div>

<div class="summary">
<div><p>Entradas</p><strong id="totalIncome">R$ 0.00</strong></div>
<div><p>Saídas</p><strong id="totalExpense">R$ 0.00</strong></div>
<div><p>Saldo</p><strong id="balance">R$ 0.00</strong></div>
</div>

<label>Meta Mensal: <span id="metaLabel">R$ 1000.00</span></label>
<div class="progress-container"><div class="progress-bar" id="progressBar">0%</div></div>

<div>
<label>Filtrar por categoria:</label>
<select id="filterCategory" onchange="render()">
<option value="All">Todas</option>
<option value="Alimentação">Alimentação</option>
<option value="Transporte">Transporte</option>
<option value="Lazer">Lazer</option>
<option value="Investimento">Investimento</option>
<option value="Outro">Outro</option>
</select>
</div>

<div id="list"></div>
<canvas id="myChart" width="400" height="200"></canvas>

<script>
let transactions = JSON.parse(localStorage.getItem("transactions")) || [];
let meta = parseFloat(localStorage.getItem("meta")) || 1000;

function save(){ localStorage.setItem("transactions", JSON.stringify(transactions)); }

function addTransaction(){
  const desc=document.getElementById("desc").value;
  const amount=parseFloat(document.getElementById("amount").value);
  const type=document.getElementById("type").value;
  const category=document.getElementById("category").value;
  if(!desc||!amount) return;
  transactions.push({id:Date.now(),desc,amount,type,category});
  document.getElementById("desc").value="";
  document.getElementById("amount").value="";
  save();
  render();
}

function removeTransaction(id){ transactions=transactions.filter(t=>t.id!==id); save(); render(); }

function render(){
  const list=document.getElementById("list");
  const filter=document.getElementById("filterCategory").value;
  const filtered=filter==='All'?transactions:transactions.filter(t=>t.category===filter);
  const totalIncome=filtered.filter(t=>t.type==='income').reduce((acc,t)=>acc+t.amount,0);
  const totalExpense=filtered.filter(t=>t.type==='expense').reduce((acc,t)=>acc+t.amount,0);
  const balance=totalIncome-totalExpense;

  document.getElementById("totalIncome").innerText="R$ "+totalIncome.toFixed(2);
  document.getElementById("totalExpense").innerText="R$ "+totalExpense.toFixed(2);
  document.getElementById("balance").innerText="R$ "+balance.toFixed(2);

  list.innerHTML="";
  filtered.forEach(t=>{
    const div=document.createElement("div");
    div.classList.add("transaction");
    div.innerHTML=`<span>${t.desc} (${t.category})</span><span class='${t.type}'>${t.type==='income'?'+':'-'} R$ ${t.amount.toFixed(2)}</span><button class='delete' onclick='removeTransaction(${t.id})'>X</button>`;
    list.appendChild(div);
  });

  const progressPercent=Math.min((totalIncome/meta)*100,100);
  document.getElementById('progressBar').style.width=progressPercent+'%';
  document.getElementById('progressBar').innerText=Math.round(progressPercent)+'%';

  const ctx=document.getElementById('myChart').getContext('2d');
  if(window.barChart) window.barChart.destroy();
  window.barChart=new Chart(ctx,{
    type:'line',
    data:{
      labels:filtered.map(t=>t.desc),
      datasets:[
        {label:'Entradas', data:filtered.map(t=>t.type==='income'?t.amount:0), borderColor:'#22c55e', fill:false},
        {label:'Saídas', data:filtered.map(t=>t.type==='expense'?t.amount:0), borderColor:'#ef4444', fill:false}
      ]
    },
    options:{responsive:true, plugins:{legend:{display:true}}, scales:{y:{beginAtZero:true}}}
  });
}

render();
</script>
</body>
</html>
