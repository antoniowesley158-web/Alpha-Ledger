<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Ledger - Configurações</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0f172a;color:white;margin:0;padding:20px;}
h1{text-align:center;margin-bottom:20px;}
.nav{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.nav a{color:#22c55e;text-decoration:none;font-weight:bold;}
.nav a:hover{text-decoration:underline;}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:15px;}
input, select, button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;font-size:14px;}
button{background:#22c55e;color:white;font-weight:bold;cursor:pointer;transition: opacity 0.2s;}
button:hover{opacity:0.9;}
</style>
</head>
<body>
<h1>Configurações</h1>
<div class="nav">
<a href="index.html">Dashboard</a>
<a href="sobre.html">Sobre</a>
<a href="config.html">Configurações</a>
<a href="backup.html">Backup</a>
</div>

<div class="card">
<label>Nome do Usuário:</label>
<input type="text" id="username" placeholder="Digite seu nome">

<label>Meta Mensal (R$):</label>
<input type="number" id="meta" placeholder="Ex: 1000">

<label>Tema:</label>
<select id="theme">
<option value="dark">Dark</option>
<option value="light">Light</option>
</select>

<button onclick="saveConfig()">Salvar Configurações</button>
</div>

<script>
// Carregar configuração
const savedUser = localStorage.getItem('username');
const savedMeta = localStorage.getItem('meta');
const savedTheme = localStorage.getItem('theme');
if(savedUser) document.getElementById('username').value = savedUser;
if(savedMeta) document.getElementById('meta').value = savedMeta;
if(savedTheme) document.getElementById('theme').value = savedTheme;

function saveConfig(){
  const username=document.getElementById('username').value;
  const meta=document.getElementById('meta').value;
  const theme=document.getElementById('theme').value;
  if(username) localStorage.setItem('username',username);
  if(meta) localStorage.setItem('meta',meta);
  if(theme) localStorage.setItem('theme',theme);
  alert('Configurações salvas!');
}
</script>
</body>
</html>
