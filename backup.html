<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Ledger - Backup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#0f172a;color:white;margin:0;padding:20px;}
h1{text-align:center;margin-bottom:20px;}
.nav{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.nav a{color:#22c55e;text-decoration:none;font-weight:bold;}
.nav a:hover{text-decoration:underline;}
.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:15px;}
input, button{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;font-size:14px;}
button{background:#22c55e;color:white;font-weight:bold;cursor:pointer;transition: opacity 0.2s;}
button:hover{opacity:0.9;}
</style>
</head>
<body>
<h1>Backup & Import</h1>
<div class="nav">
<a href="index.html">Dashboard</a>
<a href="sobre.html">Sobre</a>
<a href="config.html">Configurações</a>
<a href="backup.html">Backup</a>
</div>

<div class="card">
<button onclick="exportCSV()">Exportar CSV</button>
<input type="file" id="fileInput">
<button onclick="importCSV()">Importar CSV</button>
</div>

<script>
function exportCSV(){
  let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
  if(transactions.length===0){alert('Não há dados para exportar!'); return;}
  let csv='Descrição,Valor,Tipo,Categoria\n';
  transactions.forEach(t=>{csv+=`${t.desc},${t.amount},${t.type},${t.category}\n`});
  let blob=new Blob([csv],{type:'text/csv'});
  let link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.download='alpha_ledger_backup.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function importCSV(){
  const file=document.getElementById('fileInput').files[0];
  if(!file){alert('Selecione um arquivo CSV!'); return;}
  const reader=new FileReader();
  reader.onload=function(e){
    const text=e.target.result.split('\n');
    let newTransactions=[];
    for(let i=1;i<text.length;i++){
      const line=text[i].trim();
      if(line==='') continue;
      const [desc,amount,type,category]=line.split(',');
      newTransactions.push({id:Date.now()+i, desc, amount:parseFloat(amount), type, category});
    }
    localStorage.setItem('transactions',JSON.stringify(newTransactions));
    alert('Importação concluída!');
  }
  reader.readAsText(file);
}
</script>
</body>
</html>
